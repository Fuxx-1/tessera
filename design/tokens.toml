schema_version = 1

[metadata]
name = "Tessera cross-platform design tokens"
owner = "design-system"
authority = "native/docs/ui-spec.md"

[shared.palette]
gray_0 = "#ffffff"
gray_50 = "#f9f9f9"
gray_100 = "#ededed"
gray_200 = "#e3e3e1"
gray_300 = "#afafaf"
gray_500 = "#5d5d5d"
gray_600 = "#414141"
gray_700 = "#303030"
gray_800 = "#212121"
gray_900 = "#181818"
gray_1000 = "#0d0d0d"

[shared.typography]
font_sans = "ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, \"PingFang SC\", \"Microsoft YaHei\", sans-serif"
font_mono = "ui-monospace, \"SF Mono\", \"SFMono-Regular\", Menlo, Consolas, \"Liberation Mono\", monospace"
text_xs = "11px"
text_sm = "12px"
text_base = "14px"
text_lg = "16px"
text_heading_sm = "18px"
text_heading_md = "20px"
text_heading_lg = "24px"
text_xl = "28px"
text_2xl = "36px"
weight_normal = 400
weight_medium = 500
weight_semibold = 600
weight_bold = 700
leading_tight = 1.25
leading_snug = 1.375
leading_normal = 1.5
leading_relaxed = 1.625
tracking_tight = 0
tracking_heading = 0

[shared.geometry]
corner_radius_scale = 1
radius_2xs = "2px"
radius_xs = "4px"
radius_sm = "6px"
radius_md = "8px"
radius_lg = "10px"
radius_xl = "12px"
radius_2xl = "16px"
radius_3xl = "20px"
radius_4xl = "24px"
radius_full = "9999px"
space_1 = "4px"
space_2 = "8px"
space_3 = "12px"
space_4 = "16px"
space_5 = "20px"
space_6 = "24px"
space_8 = "32px"
control_height_sm = "30px"
control_height = "36px"
control_height_lg = "44px"
topbar_height = "46px"
panel_toolbar_height = "36px"
shell_sidebar_width = "252px"
navigation_rail_width = "64px"
content_max_width = "1120px"
hit_target_min = "24px"
hit_target_coarse = "40px"
focus_gap_width = "1px"
focus_ring_width = "2px"
focus_ring_offset = "2px"

[shared.motion]
fast = "120ms"
base = "160ms"
panel = "200ms"
easing_standard = "cubic-bezier(.4, 0, .2, 1)"
easing_enter = "cubic-bezier(.19, 1, .22, 1)"
easing_exit = "cubic-bezier(.65, 0, .4, 1)"

[themes.light.colors]
canvas = "#f9f9f9"
sidebar = "#f3f3f2"
surface_sunken = "#f0f0ee"
surface_muted = "#f5f5f4"
surface = "#ffffff"
surface_elevated = "#ffffff"
surface_glass = "#f9f9f9f0"
surface_hover = "#1a1c1f0a"
surface_active = "#1a1c1f14"
surface_selected = "#1a1c1f0d"
overlay = "#00000047"
overlay_strong = "#0000006b"
ink = "#1a1c1f"
text = "#1a1c1f"
text_secondary = "#5d5d5d"
text_tertiary = "#6b6d6f"
text_quaternary = "#6e7072"
text_disabled = "#6b6d6f"
text_on_accent = "#ffffff"
border_light = "#1a1c1f0d"
border = "#1a1c1f14"
border_heavy = "#1a1c1f24"
accent = "#0285ff"
accent_hover = "#339cff"
accent_soft = "#e5f3ff"
accent_text = "#005ea8"
link_text = "#005ea8"
focus_gap = "#ffffff"
focus_ring = "#006dba"
tooltip_bg = "#1f1f1d"
