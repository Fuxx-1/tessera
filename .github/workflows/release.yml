name: Web Release
on:
  push:
    tags: ['web-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated web-v version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: web-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source-safety:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate annotated Web tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/validate-release.mjs
      - run: node --test scripts/public-release-scan.test.mjs scripts/validate-release.test.mjs
      - run: node scripts/public-release-scan.mjs --history
      - run: git diff --check
  web:
    needs: source-safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-safety.outputs.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:library
      - run: bun run scan:deps
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_generate_tokens.py
      - run: node scripts/public-release-scan.mjs --dir dist-library
      - run: node scripts/public-release-scan.mjs --dir dist
      - name: Package Web library and gallery
        run: |
          mkdir -p release-assets
          npm pack ./dist-library --pack-destination release-assets
          tar --owner=0 --group=0 --numeric-owner -czf release-assets/tessera-web-gallery.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: [source-safety, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-safety.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Publish Web preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source-safety.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Tessera Web $RELEASE_TAG (Preview)" --notes-file docs/release-notes.md
