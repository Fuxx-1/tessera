name: Web CI
on:
  push:
    branches: [codex/web]
  pull_request:
    branches: [codex/web]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:library
      - run: bun run scan:deps
      - run: node --test scripts/public-release-scan.test.mjs scripts/validate-release.test.mjs
      - run: node scripts/public-release-scan.mjs --history
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_generate_tokens.py
