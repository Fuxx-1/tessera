name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:library
      - run: bun run scan:deps
      - run: node --test scripts/public-release-scan.test.mjs
      - run: node scripts/public-release-scan.mjs --history
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tessera-target" >> "$GITHUB_ENV"
      - run: bash scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> ${{ env.CARGO_TARGET_DIR }}
          shared-key: linux-x64-rust188
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo test --manifest-path native/Cargo.toml --locked --workspace
