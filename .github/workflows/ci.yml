name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node --test scripts/public-release-scan.test.mjs
      - run: node scripts/public-release-scan.mjs --history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tessera-target" >> "$GITHUB_ENV"
      - run: bash scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> ${{ env.CARGO_TARGET_DIR }}
          shared-key: linux-x64-rust188
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo test --manifest-path native/Cargo.toml --locked --workspace
